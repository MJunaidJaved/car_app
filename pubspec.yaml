name: carpool_app
description: A ShareWay ride-sharing Flutter application for Pakistan
publish_to: 'none'
version: 1.0.2+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.7.10
  firebase_storage: ^11.5.6
  google_sign_in: ^6.3.0
  
  # State Management
  provider: ^6.1.1
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  
  # Location & Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  flutter_rating_bar: ^4.0.1
  flutter_dotenv: ^5.1.0
  cloudinary_public: ^0.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env
